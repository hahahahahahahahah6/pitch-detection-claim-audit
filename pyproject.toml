[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-detection-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
pitch-detection-claim-audit = "pitch_detection_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["pitch_detection_claim_audit*"]
